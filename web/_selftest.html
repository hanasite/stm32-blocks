<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>STM32 积木工坊 - UI 自检</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>STM32 积木工坊</h1>
  <input id="project-name" type="text" value="我的工程" title="工程名（下载的文件夹名）">
  <div id="error-banner" class="hidden"></div>
  <button id="btn-download" disabled>⬇ 下载完整工程</button>
</header>
<main>
  <section id="panel-objects">
    <h2>对象区</h2>
    <div id="object-list"></div>
    <button id="btn-add-object">＋ 新建对象</button>
  </section>
  <section id="panel-canvas">
    <h2>主循环</h2>
    <div id="palette">
      <div class="pal-block pal-action" data-palette="action">动作</div>
      <div class="pal-block pal-delay"  data-palette="delay">延时</div>
      <div class="pal-block pal-if"     data-palette="if">如果</div>
    </div>
    <div id="canvas">
      <div id="loop-slot" data-drop-list="loop"></div>
      <div id="trash" class="hidden">🗑</div>
    </div>
  </section>
  <section id="panel-code">
    <h2>生成的代码</h2>
    <pre id="code-view"></pre>
    <button id="btn-copy">复制代码</button>
  </section>
</main>

<dialog id="object-dialog">
  <form method="dialog">
    <h3 id="dlg-title">新建对象</h3>
    <label>名字 <input id="dlg-name" type="text"></label>
    <div id="dlg-types"></div>
    <div id="dlg-params"></div>
    <p id="dlg-hint" class="hidden"></p>
    <menu><button value="cancel">取消</button><button id="dlg-ok" value="ok">确定</button></menu>
  </form>
</dialog>

<script src="vendor/jszip.min.js"></script>
<script src="js/catalog.js"></script>
<script src="js/model.js"></script>
<script src="js/validate.js"></script>
<script src="js/codegen.js"></script>
<script src="js/examples.js"></script>
<script src="js/render.js"></script>
<script src="js/dragdrop.js"></script>
<script src="js/objects.js"></script>
<script src="js/app.js"></script>
<script>
/* UI 自检：模拟用户操作序列，结果以 SELFTEST 行输出到 #selftest-results。
   用 Edge/Chrome 无头跑：msedge --headless=new --dump-dom --virtual-time-budget=8000 web/_selftest.html */
window.confirm = function () { return true; };   /* 删除确认自动“确定” */
window.alert = function (msg) { (window._alerts = window._alerts || []).push(msg); };
window._errors = [];
window.onerror = function (msg, src, line, col) {
  window._errors.push(msg + " @" + (src || "").split("/").pop() + ":" + line + ":" + col);
  return false;
};
window.addEventListener("DOMContentLoaded", function () {
  setTimeout(function () {
    var out = [];
    function rec(name, ok, extra) {
      out.push("SELFTEST " + (ok ? "PASS" : "FAIL") + " " + name + (extra !== undefined ? " :: " + extra : ""));
    }
    try {
      var project = window.App.getProject();
      // 1) 初始渲染（blink 示例：key1/led1 两张卡 + 代码含 Key_IsPressed）
      rec("init-objects", document.querySelectorAll("#object-list .obj-card").length === 2,
          "cards=" + document.querySelectorAll("#object-list .obj-card").length);
      rec("init-code", document.getElementById("code-view").textContent.indexOf("Key_IsPressed") >= 0);
      rec("init-banner-hidden", document.getElementById("error-banner").classList.contains("hidden"));
      rec("init-download-enabled", document.getElementById("btn-download").disabled === false);

      // 2) 新建对象：蜂鸣器 buzzer9
      document.getElementById("btn-add-object").click();
      var dlg = document.getElementById("object-dialog");
      rec("dialog-open", dlg.open === true);
      var typeBtns = document.querySelectorAll("#dlg-types button");
      var buzBtn = Array.prototype.filter.call(typeBtns, function (b) { return b.textContent === "蜂鸣器"; })[0];
      buzBtn.click();
      document.getElementById("dlg-name").value = "buzzer9";
      document.getElementById("dlg-ok").click();
      rec("add-object", project.objects.length === 3 && document.querySelectorAll("#object-list .obj-card").length === 3,
          "objects=" + project.objects.length);
      rec("add-code", document.getElementById("code-view").textContent.indexOf("Buzzer buzzer9") >= 0);

      // 3) 引脚冲突：编辑 buzzer9 引脚为 PC13（与 led1 冲突）
      document.querySelectorAll("#object-list .obj-card")[2].click();
      document.querySelector('#dlg-params select[data-param="pin"]').value = "PC13";
      document.getElementById("dlg-ok").click();
      rec("conflict-banner", !document.getElementById("error-banner").classList.contains("hidden"),
          "banner=" + document.getElementById("error-banner").textContent);
      rec("conflict-disable-download", document.getElementById("btn-download").disabled === true);

      // 恢复引脚 → 横幅消失
      document.querySelectorAll("#object-list .obj-card")[2].click();
      document.querySelector('#dlg-params select[data-param="pin"]').value = "PB1";
      document.getElementById("dlg-ok").click();
      rec("conflict-cleared", document.getElementById("error-banner").classList.contains("hidden")
          && document.getElementById("btn-download").disabled === false);

      // 4) 重名拦截：新建 led 重名 led1 → 应被 hint 拦下且对象数不变
      document.getElementById("btn-add-object").click();
      var ledBtn = Array.prototype.filter.call(document.querySelectorAll("#dlg-types button"),
          function (b) { return b.textContent === "LED"; })[0];
      ledBtn.click();
      document.getElementById("dlg-name").value = "led1";
      document.getElementById("dlg-ok").click();
      rec("dup-name-blocked", project.objects.length === 3 && document.getElementById("object-dialog").open === true);
      document.querySelector("#object-dialog button[value='cancel']").click();

      // 5) 删除 key1（confirm 已自动 true）；blink 的 if 引用 key1 应被连带清理
      document.querySelectorAll("#object-list .obj-card")[0].querySelector(".obj-del").click();
      rec("delete-key", project.objects.length === 2
          && document.getElementById("code-view").textContent.indexOf("Key_IsPressed") < 0,
          "objects=" + project.objects.length);

      // 6) localStorage 自动保存
      var saved = localStorage.getItem("stm32-blocks:project");
      rec("localstorage", !!saved && saved.indexOf("buzzer9") >= 0);

      // 7) 代码面板复制按钮存在且菜单渲染（静态检查）
      rec("copy-button", !!document.getElementById("btn-copy"));
      rec("loop-rendered", document.getElementById("loop-slot").children.length >= 0);

      // 8) 拖拽内核（合成指针事件：palette→画布 / 嵌套 / 自嵌套拒绝 / 垃圾桶删除）
      function pex(type, tgt, ex, ey) {
        tgt.dispatchEvent(new PointerEvent(type, {
          bubbles: true, cancelable: true, clientX: ex, clientY: ey, pointerId: 1, isPrimary: true
        }));
      }
      function mid(elm) { var r = elm.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
      function cdrag(src, tx, ty, via) {
        var sr = src.getBoundingClientRect();
        pex("pointerdown", src, sr.left + 6, sr.top + 6);
        (via || []).forEach(function (pt) {
          var hit = document.elementFromPoint(pt[0], pt[1]);
          pex("pointermove", hit || document.body, pt[0], pt[1]);
        });
        var drop = document.elementFromPoint(tx, ty);
        pex("pointerup", drop || document.body, tx, ty);
      }

      var slot = document.getElementById("loop-slot");
      var m = mid(slot);
      var delayPal = document.querySelector('[data-palette="delay"]');
      cdrag(delayPal, m[0], m[1], [[m[0] - 30, m[1] - 30], [m[0], m[1]]]);
      rec("drag-add-delay", project.loop.length === 1 && project.loop[0].kind === "delay",
          "loop=" + project.loop.map(function (n) { return n.kind; }).join(","));
      rec("drag-add-code", document.getElementById("code-view").textContent.indexOf("Delay_ms(100)") >= 0);

      // "如果"积木需要按键/整数对象才能生成；前面测试删掉了 key1，这里补一个按键对象
      Model.addObject(project, "key", { pin: "PA2", pull: "up" });
      window.App.refresh();

      var ifPal = document.querySelector('[data-palette="if"]');
      var srect = slot.getBoundingClientRect();
      var bx = srect.left + 40, by = srect.bottom - 8;
      cdrag(ifPal, bx, by, [[bx, by - 50], [bx, by]]);
      /* 手动复现渲染路径取真实异常（file:// 下 onerror 拿不到细节） */
      try {
        var probeIf = window.App.makePaletteNode("if", project);
        project.loop.push(probeIf);
        window.App.refresh();
        project.loop.pop();
        window.App.refresh();
      } catch (e) {
        out.push("SELFTEST RENDERERR " + e.message
          + " || probeIf=" + JSON.stringify(probeIf)
          + " || objs=" + JSON.stringify(project.objects.map(function (o) { return o.id + ":" + o.type + ":" + o.name; }))
          + " || stack=" + (e.stack || "").split("\n").slice(0, 3).join(" | "));
      }
      var dbgMake = window.App.makePaletteNode("if", project);
      var hitEl = document.elementFromPoint(bx, by);
      var tRect = document.getElementById("trash").getBoundingClientRect();
      rec("drag-add-if", project.loop.length === 2 && project.loop[1].kind === "if",
          "loop=" + project.loop.map(function (n) { return n.kind; }).join(",")
          + " objs=" + project.objects.length
          + " makeIf=" + (dbgMake ? dbgMake.kind : "null")
          + " domBlocks=" + document.querySelectorAll("#loop-slot .blk").length
          + " hit=" + (hitEl ? (hitEl.id || hitEl.className || hitEl.tagName) : "null")
          + " bxby=" + Math.round(bx) + "," + Math.round(by)
          + " slot=" + Math.round(srect.left) + "," + Math.round(srect.top) + "," + Math.round(srect.right) + "," + Math.round(srect.bottom)
          + " trash=" + Math.round(tRect.left) + "," + Math.round(tRect.top) + "," + Math.round(tRect.right) + "," + Math.round(tRect.bottom));

      var delayEl = document.querySelector('[data-node-id="' + project.loop[0].__uid + '"]');
      var body = document.querySelector("#loop-slot .blk-if .if-body");
      var bm = mid(body);
      var dm = mid(delayEl);
      cdrag(delayEl, bm[0], bm[1], [[dm[0], dm[1]], [bm[0], bm[1]]]);
      rec("drag-nest", project.loop.length === 1 && project.loop[0].kind === "if" && project.loop[0].then.length === 1,
          "then=" + (project.loop[0].then || []).length);

      var ifEl = document.querySelector('[data-node-id="' + project.loop[0].__uid + '"]');
      var im = mid(ifEl);
      cdrag(ifEl, bm[0], bm[1], [[im[0], im[1]], [bm[0], bm[1]]]);
      rec("drag-self-reject", project.loop.length === 1 && project.loop[0].then.length === 1);

      var trash = document.getElementById("trash");
      ifEl = document.querySelector('[data-node-id="' + project.loop[0].__uid + '"]');   // 重渲染后需重新查询
      im = mid(ifEl);
      pex("pointerdown", ifEl, im[0] - 3, im[1] - 3);
      pex("pointermove", document.body, im[0], im[1]);        // 让垃圾桶显示出来
      var tm = mid(trash);                                      // 此时 rect 有效
      var hitT = document.elementFromPoint(tm[0], tm[1]);
      pex("pointermove", hitT || document.body, tm[0], tm[1]);  // 移到垃圾桶上 → overTrash
      pex("pointerup", hitT || document.body, tm[0], tm[1]);
      rec("drag-trash-delete", project.loop.length === 0, "loop=" + project.loop.length
          + " tm=" + Math.round(tm[0]) + "," + Math.round(tm[1]));
    } catch (err) {
      out.push("SELFTEST FAIL exception :: " + (err && err.message));
    }
    if (window._errors.length > 0) {
      out.push("SELFTEST PAGEERR " + window._errors.join(" | "));
    }
    var pre = document.createElement("pre");
    pre.id = "selftest-results";
    pre.textContent = out.join("\n");
    document.body.appendChild(pre);
  }, 200);
});
</script>
</body>
</html>
